<main class="home-container">
  <section class="home-header card">
    <h1>Solo TTRPG Companion</h1>
    <p>
      Build your own solo campaign workflow: ask the MUNE oracle, track interventions, and run a fully schema-driven character sheet without any backend.
    </p>
  </section>

  <section class="tool-grid">
    @for (tool of tools; track tool.route) {
      <article class="card tool-card">
        <h2>{{ tool.title }}</h2>
        <p>{{ tool.description }}</p>
        <a [routerLink]="tool.route" class="action-link">{{ tool.action }}</a>
      </article>
    }
  </section>
</main>
