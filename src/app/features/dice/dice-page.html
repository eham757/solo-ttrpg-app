<main class="dice-page">
  <section class="card">
    <h1>Dice and Generators</h1>
    <p>
      Your original toolbox: fast oracles, random generators, descriptions, and classic tabletop dice rollers.
    </p>
  </section>

  <section class="oracle-section">
    <h2>Quick Generators</h2>
    <div class="row">
      <app-random-item-selector-component
        title="Quick Oracle"
        buttonText="Roll"
        [items]="['Yes and', 'Yes', 'Yes but', 'No but', 'No', 'No and']"
        [showList]="true"
      ></app-random-item-selector-component>

      <app-random-item-selector-component
        title="Choose a direction"
        buttonText="Choose"
        [items]="['North', 'East', 'South', 'West']"
        [showList]="false"
      ></app-random-item-selector-component>

      <app-random-item-selector-component
        title="Choose a color"
        buttonText="Choose"
        [items]="['Red', 'Blue', 'Green', 'Yellow', 'Purple', 'Orange']"
        [showList]="false"
      ></app-random-item-selector-component>
    </div>
  </section>

  <section class="description-section">
    <h2>Descriptions</h2>
    <div class="row">
      <app-multi-random-item-selector
        title="Choose descriptions (short list)"
        buttonText="Roll for descriptions"
        [items]="shortDescriptionList"
        [showList]="false"
        [rollCount]="3"
        [allowModifyRollCount]="true"
      ></app-multi-random-item-selector>

      <app-multi-random-item-selector
        title="Choose descriptions (long list)"
        buttonText="Roll for descriptions"
        [items]="longDescriptionList"
        [showList]="false"
        [rollCount]="3"
        [allowModifyRollCount]="true"
      ></app-multi-random-item-selector>
    </div>
  </section>

  <section class="dice-section">
    <h2>Dice Roller</h2>
    <div class="row">
      <app-multi-dice-roller-component title="Roll multiple dice" buttonText="Roll Dice"></app-multi-dice-roller-component>
    </div>

    <p>Or roll individual dice:</p>
    <div class="row">
      <app-die-roller-component title="Roll a d100" buttonText="Roll d100" [numberOfSides]="100"></app-die-roller-component>
      <app-die-roller-component title="Roll a d20" buttonText="Roll d20" [numberOfSides]="20"></app-die-roller-component>
      <app-die-roller-component title="Roll a d12" buttonText="Roll d12" [numberOfSides]="12"></app-die-roller-component>
      <app-die-roller-component title="Roll a d10" buttonText="Roll d10" [numberOfSides]="10"></app-die-roller-component>
      <app-die-roller-component title="Roll a d8" buttonText="Roll d8" [numberOfSides]="8"></app-die-roller-component>
      <app-die-roller-component title="Roll a d6" buttonText="Roll d6" [numberOfSides]="6"></app-die-roller-component>
      <app-die-roller-component title="Roll a d4" buttonText="Roll d4" [numberOfSides]="4"></app-die-roller-component>
      <app-die-roller-component title="Roll a d3" buttonText="Roll d3" [numberOfSides]="3"></app-die-roller-component>
      <app-die-roller-component title="Roll a d2" buttonText="Roll d2" [numberOfSides]="2"></app-die-roller-component>
    </div>
  </section>
</main>
